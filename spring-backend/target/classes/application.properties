server.port=${PORT:3001}
spring.application.name=ka-molema-backend
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

plant.id.api-key=${PLANT_ID_API_KEY:}
plant.id.url=https://plant.id/api/v3/health_assessment

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

ka-molema.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
ka-molema.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
