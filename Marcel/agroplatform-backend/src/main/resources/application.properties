# =========================================================
# AgroPlatform – Module Agronomes
# =========================================================

server.port=8086

# --- Base de données MySQL ---
# En dev local (XAMPP) : spring.datasource.url=jdbc:mysql://localhost:3306/...
# En Docker : l'hôte "mysql" correspond au service dans docker-compose.yml
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/agroplatform_agronomes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Douala&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# IMPORTANT : remplace cette clé par une vraie clé sécurisée en production
app.jwt.secret=${JWT_SECRET:agroplatform-super-secret-key-marcel-module-agronomes-2025-cameroun-secure-min64chars}
app.jwt.expiration-ms=86400000

# --- CORS (autorise le frontend React en dev) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- WebSocket ---
app.websocket.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- SpringDoc / Swagger UI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Logs ---
logging.level.cm.agroplatform=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.security=WARN

# --- Google Maps API ---
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:REMPLACE_PAR_TA_CLE_API}

# --- Suivi agriculteurs ---
app.suivi.max-agriculteurs=4
